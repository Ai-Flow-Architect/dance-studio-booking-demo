<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ダンススタジオ予約サイト デモ</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="複数スタジオのレッスン予約と、繰り返し日程の自動展開・管理画面のデモ（架空データ）">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c2185b'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3ED%3C/text%3E%3C/svg%3E">
<meta property="og:title" content="ダンススタジオ予約サイト デモ">
<meta property="og:description" content="スタジオ→ジャンル→レッスン→予約の流れと、繰り返し日程の自動展開（架空データ）">
<meta property="og:type" content="website">
<meta property="og:image" content="https://ai-flow-architect.github.io/dance-studio-booking-demo/screenshot.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Zen+Kaku+Gothic+New:wght@700;900&family=Barlow:wght@500;600&display=swap">
<style>
/* 白地・墨色のボタン・写真カード＋1週間の空き状況（参考＝スペース予約サイトの一覧）。端末がダークでも白のまま */
:root,:root[data-theme="dark"]{color-scheme:light}
:root{
  --paper:#ffffff; --mist:#f4f5f7; --line:#e4e4e8; --ink:#1c1d21; --sub:#6b6d75; --graphite:#2e2f33;
  --stage:#1e7fd8; --stage-soft:#e8f2fc; --spot:#e4405f; --spot-soft:#fdecef; --ok:#1f8a5b; --ok-soft:#e6f4ee;
  --s1:#2e2f33; --s2:#1e7fd8; --s3:#c2773a;
  --f-head:"Zen Kaku Gothic New","Noto Sans JP",system-ui,sans-serif;
  --f-body:"Noto Sans JP","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  --f-num:"Barlow","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-weight:400;font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--stage);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* 上の帯 */
header.top{position:sticky;top:0;z-index:20;background:var(--paper);box-shadow:0 1px 0 var(--line),0 6px 16px rgba(20,20,30,.04)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:12px 24px;max-width:1240px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-family:var(--f-head);font-weight:900;font-size:20px;letter-spacing:.04em}
.brand b i{font-style:normal;color:var(--stage)}
.brand small{font-size:11.5px;color:var(--sub)}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap}
nav.tabs button{border:0;background:none;padding:8px 14px;color:var(--sub);font-weight:700;font-size:13px;border-bottom:2px solid transparent}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.note{background:var(--mist);font-size:12px;color:var(--sub)}
.note div{max-width:1240px;margin:0 auto;padding:6px 24px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.note button{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:2px 10px;font-size:12px}
main{max-width:1240px;margin:0 auto;padding:22px 24px 72px}
@media (max-width:700px){.top-in,main,.note div{padding-left:14px;padding-right:14px}}
h1{font-family:var(--f-head);font-weight:900;font-size:26px;letter-spacing:.02em;margin:0 0 4px;line-height:1.35}
h2{font-size:13px;letter-spacing:.06em;color:var(--sub);margin:24px 0 10px;font-weight:700}
.lead{color:var(--sub);margin:0 0 18px}

/* 予約サイト：見出しと手順 */
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13px;color:var(--sub);margin-bottom:14px}
.crumb button{border:0;background:none;padding:0;color:var(--stage);font-weight:700}
.crumb .sep{color:#b9bac0}
.flow{display:flex;gap:0;margin:0 0 20px;padding:0;list-style:none;border:1px solid var(--line);border-radius:6px;overflow:hidden;font-size:12.5px}
.flow li{flex:1;text-align:center;padding:8px 6px;color:var(--sub);background:var(--paper);border-right:1px solid var(--line)}
.flow li:last-child{border-right:0}
.flow li.on{background:var(--graphite);color:#fff;font-weight:700}
.flow li.done{color:var(--ink);background:var(--mist)}

/* スタジオ（写真カード） */
.studios{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.scard{display:block;width:100%;padding:0;text-align:left;border:1px solid var(--line);border-radius:8px;background:var(--paper);overflow:hidden;transition:box-shadow .2s,transform .2s}
.scard:hover{box-shadow:0 10px 24px rgba(20,20,30,.10);transform:translateY(-2px)}
.ph{position:relative;aspect-ratio:4/3;background:var(--mist) center/cover no-repeat}
.ph .badge{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.94);color:var(--ink);font-size:11.5px;font-weight:700;border-radius:3px;padding:2px 8px}
.scard .body{padding:12px 14px 14px}
.scard b{display:block;font-family:var(--f-head);font-size:18px;font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--sub);font-size:12.5px;margin-top:2px}
.meta span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#c9cad0;margin-right:6px;vertical-align:2px}
.scard .genres{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}

/* タグ・ジャンルの選択 */
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:3px;background:var(--mist);color:var(--ink);white-space:nowrap}
.tag.blue{background:var(--stage-soft);color:var(--stage)}
.tag.red{background:var(--spot-soft);color:var(--spot)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.chip-btn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 16px;font-weight:700;font-size:13px}
.chip-btn:hover{border-color:var(--ink)}
.chip-btn small{color:var(--sub);font-weight:400;margin-left:6px}

/* レッスンのカード（写真＋1週間の空き） */
.lcard{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;padding:18px 0;border-top:1px solid var(--line)}
.lcard:last-child{border-bottom:1px solid var(--line)}
.lcard .ph{border-radius:8px}
.lhead{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.lcard h3{font-family:var(--f-head);font-weight:700;font-size:18px;margin:0;line-height:1.45}
.price{display:flex;align-items:baseline;justify-content:flex-end;gap:4px;margin:4px 0 8px;color:var(--ink)}
.price small{font-size:13px;color:var(--sub)}
.price b{font-family:var(--f-num);font-weight:600;font-size:28px;line-height:1}
.week{display:grid;grid-template-columns:28px repeat(7,minmax(0,1fr)) 28px;border:1px solid var(--line);border-radius:6px;background:var(--paper);overflow:hidden}
.week .nav{border:0;background:var(--mist);color:var(--stage);font-size:16px}
.week .nav:disabled{color:#c7c8ce;cursor:default}
.cell{border:0;border-left:1px solid var(--line);background:var(--paper);padding:6px 2px 8px;text-align:center;font-size:12px;line-height:1.35;min-width:0}
.cell .w{color:var(--sub)} .cell .w.sun{color:var(--spot)} .cell .w.sat{color:var(--stage)}
.cell .d{display:block;font-family:var(--f-num);font-weight:600;font-size:15px}
.cell .m{display:block;font-size:17px;line-height:1.3;color:var(--stage)}
.cell .t{display:block;font-family:var(--f-num);font-size:11px;color:var(--sub)}
.cell.few .m{color:var(--spot)}
.cell.full .m,.cell.none .m{color:#b9bac0}
button.cell:hover{background:var(--stage-soft)}
button.cell:disabled{cursor:not-allowed;background:var(--paper)}
.legend-m{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--sub);margin-top:6px}
@media (max-width:860px){.lcard{grid-template-columns:minmax(0,1fr)}.lcard .ph{aspect-ratio:16/9}}
@media (max-width:480px){.week{grid-template-columns:22px repeat(7,minmax(0,1fr)) 22px}.cell .t{display:none}.cell .d{font-size:13px}}

/* 予約の入力（右から出るシート） */
.sheet-bg{position:fixed;inset:0;background:rgba(20,20,28,.42);z-index:30;display:flex;justify-content:flex-end}
.sheet{width:min(460px,100%);height:100%;overflow:auto;background:var(--paper);box-shadow:-10px 0 30px rgba(0,0,0,.12);animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet .ph{aspect-ratio:16/9;border-radius:0}
.sheet .in{padding:18px 22px 28px}
.sheet .close{position:absolute;right:10px;top:10px;border:0;background:rgba(255,255,255,.94);border-radius:50%;width:34px;height:34px;font-size:18px}
.when{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:12px 0 4px;font-size:13.5px}
.when dt{color:var(--sub)} .when dd{margin:0;font-weight:700}
.form{display:grid;gap:12px;max-width:520px}
.form label{display:grid;gap:4px;font-size:13px;font-weight:700}
.form input,.form select{border:1px solid var(--line);border-radius:4px;padding:9px 11px;background:var(--paper);font-weight:400}
.form input:focus{border-color:var(--ink);outline:0}
.btn{border:0;background:var(--graphite);color:#fff;border-radius:4px;padding:10px 18px;font-weight:700;font-size:13.5px}
.btn:hover{background:#000}
.btn:disabled{background:#c9cad0;cursor:not-allowed}
.btn.sub{background:var(--paper);color:var(--ink);border:1px solid var(--line);font-weight:400}
.btn.sub:hover{border-color:var(--ink)}
.err{color:var(--spot);font-size:13px;min-height:1.2em}
.done-box{border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:6px;padding:16px 18px;background:var(--paper)}
.done-box b{font-family:var(--f-head);font-size:18px;color:var(--ok)}
.empty{padding:28px;border:1px dashed var(--line);border-radius:8px;color:var(--sub);text-align:center}
.foot{max-width:1240px;margin:0 auto;padding:18px 24px 40px;font-size:11px;color:var(--sub);border-top:1px solid var(--line)}

/* 共通の箱・表（カレンダー・管理画面） */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px}
table{width:100%;border-collapse:collapse;background:var(--paper);font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--sub);font-weight:700;background:var(--mist)}
.chip{display:inline-block;font-size:11.5px;padding:1px 9px;border-radius:3px;background:var(--mist);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.bad{background:var(--spot-soft);color:var(--spot)}
.cal-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.cal-head b{font-family:var(--f-num);font-weight:600;font-size:22px;min-width:130px}
.cal-head select{border:1px solid var(--line);border-radius:4px;padding:6px 8px;background:var(--paper)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .wd{font-size:12px;text-align:center;padding:5px;color:var(--sub);border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--mist)}
.cal .day{min-height:100px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;font-size:11.5px;min-width:0}
.cal .day.out{background:#fafafb;color:#b9bac0}
.cal .day.today .n{background:var(--ink);color:#fff;border-radius:3px;padding:0 6px}
.cal .n{font-family:var(--f-num);font-weight:600;font-size:13px}
.ev{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--c);background:var(--mist);border-radius:2px;padding:2px 5px;margin-top:3px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev:hover{background:var(--stage-soft)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin-top:10px;color:var(--sub)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c);margin-right:5px;vertical-align:-1px}
@media (max-width:700px){.cal .day{min-height:72px;padding:3px}.ev{font-size:10px;padding:1px 3px}}
.sub-tabs{display:flex;gap:0;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--line)}
.sub-tabs button{border:0;border-bottom:2px solid transparent;background:none;padding:8px 14px;color:var(--sub);font-weight:700;font-size:13px}
.sub-tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.rule-box{border:1px solid var(--stage);border-radius:6px;padding:14px;display:grid;gap:10px;background:var(--stage-soft)}
.rule-box > b{color:var(--stage)}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inline label{display:flex;gap:4px;align-items:center;font-weight:400}
.preview{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:4px;padding:8px 12px 8px 34px;background:var(--paper);font-size:13px;font-family:var(--f-num)}
.preview li{margin:2px 0}
.mail{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--paper);margin-bottom:8px}
.mail .mh{font-size:12px;color:var(--sub)}
.mail pre{white-space:pre-wrap;font-family:var(--f-body);margin:6px 0 0}
.tag-del{border:0;background:none;color:var(--spot);font-size:12px}
.reveal{animation:rise .35s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<header class="top"><div class="top-in">
  <div class="brand"><b>DANCE<i>.</i>BOOK</b><small>ダンススタジオ予約｜デモ（架空のスタジオ・架空のデータ）</small></div>
  <nav class="tabs" id="tabs">
    <button data-tab="book" id="tab-book">レッスンを予約</button>
    <button data-tab="calendar" id="tab-calendar">スタジオのカレンダー</button>
    <button data-tab="admin" id="tab-admin">管理画面</button>
  </nav>
</div></header>
<div class="note"><div><span>このデモはブラウザの中だけで動きます。メールは実際には送らず「送信箱」に記録します。写真はイメージです。</span><button id="reset">見本の状態に戻す</button></div></div>
<main id="app"></main>
<footer class="foot" id="credits"></footer>

<script>
"use strict";
// ===== 日付の道具（すべて端末の暦日・'YYYY-MM-DD' で扱う） =====
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const WD = ["日", "月", "火", "水", "木", "金", "土"];
const jp = s => { const d = parse(s); return (d.getMonth() + 1) + "月" + d.getDate() + "日（" + WD[d.getDay()] + "）"; };
const TODAY = ymd(new Date());

// ===== 繰り返し設定 → 日付の一覧（このデモの中心） =====
// rule = {kind:'weekly'|'biweekly'|'monthly'|'once', weekday, anchor, nths:[1..5,-1], date, start, end, skips:[]}
function nthOfMonth(d) { return Math.ceil(d.getDate() / 7); }
function isLastOfMonth(d) { const n = new Date(d); n.setDate(n.getDate() + 7); return n.getMonth() !== d.getMonth(); }
function matches(rule, s) {
  const d = parse(s);
  if (rule.kind === "once") return s === rule.date;
  if (d.getDay() !== Number(rule.weekday)) return false;
  if (rule.kind === "weekly") return true;
  if (rule.kind === "biweekly") {
    const diff = Math.round((parse(s) - parse(rule.anchor)) / 86400000);
    return diff >= 0 && diff % 14 === 0;
  }
  if (rule.kind === "monthly") {
    const nths = (rule.nths || []).map(Number);
    return nths.includes(nthOfMonth(d)) || (nths.includes(-1) && isLastOfMonth(d));
  }
  return false;
}
function expand(rule, from, to) {
  const out = [];
  const lo = rule.start && rule.start > from ? rule.start : from;
  const hi = rule.end && rule.end < to ? rule.end : to;
  if (rule.kind === "biweekly" && !rule.anchor) return out;
  for (let s = lo; s <= hi; s = addDays(s, 1)) {
    if ((rule.skips || []).includes(s)) continue;
    if (matches(rule, s)) out.push(s);
  }
  return out;
}
function ruleText(r) {
  if (r.kind === "once") return jp(r.date) + " の1回のみ";
  const w = WD[r.weekday] + "曜";
  let t = r.kind === "weekly" ? "毎週 " + w
    : r.kind === "biweekly" ? "隔週 " + w + "（" + jp(r.anchor) + " から）"
    : "毎月 " + (r.nths || []).map(n => n === -1 || n === "-1" ? "最終" : "第" + n).join("・") + " " + w;
  if (r.start) t += "／" + jp(r.start) + "〜";
  if (r.end) t += (r.start ? "" : "／〜") + jp(r.end);
  if ((r.skips || []).length) t += "／休み " + r.skips.length + "日";
  return t;
}

// ===== 見本データ =====
function seed() {
  const nextWd = wd => { let s = TODAY; while (parse(s).getDay() !== wd) s = addDays(s, 1); return s; };
  return {
    studios: [
      { id: "s1", name: "スタジオ中央", area: "駅前・3F", access: "中央駅 徒歩3分", size: "80㎡・鏡張り", photo: "p1", color: "var(--s1)", notify: ["center@example.com", "owner@example.com"] },
      { id: "s2", name: "スタジオ東口", area: "東口・B1", access: "東口駅 徒歩5分", size: "60㎡・防音", photo: "p2", color: "var(--s2)", notify: ["east@example.com", "owner@example.com"] },
      { id: "s3", name: "スタジオ港南", area: "港南・2F", access: "港南駅 徒歩2分", size: "120㎡・バーあり", photo: "p4", color: "var(--s3)", notify: ["konan@example.com"] },
    ],
    genres: [
      { id: "g1", name: "HIPHOP" }, { id: "g2", name: "JAZZ" }, { id: "g3", name: "K-POP" },
      { id: "g4", name: "キッズ" }, { id: "g5", name: "バレエ" },
    ],
    lessons: [
      { id: "l1", studio: "s1", genre: "g1", title: "HIPHOP 初級", level: "初心者歓迎", price: 2200, teacher: "講師 甲野", start: "19:00", end: "20:15", cap: 12, rule: { kind: "weekly", weekday: 2 } },
      { id: "l2", studio: "s1", genre: "g3", title: "K-POP 入門", level: "初心者歓迎", price: 2200, teacher: "講師 乙野", start: "18:00", end: "19:00", cap: 15, rule: { kind: "biweekly", weekday: 5, anchor: nextWd(5) } },
      { id: "l3", studio: "s1", genre: "g5", title: "大人バレエ", level: "大人から", price: 2750, teacher: "講師 丙野", start: "10:30", end: "12:00", cap: 8, rule: { kind: "monthly", weekday: 6, nths: [1, 3] } },
      { id: "l4", studio: "s2", genre: "g2", title: "JAZZ 中級", level: "経験者向け", price: 2500, teacher: "講師 丁野", start: "20:00", end: "21:15", cap: 10, rule: { kind: "weekly", weekday: 4 } },
      { id: "l5", studio: "s2", genre: "g4", title: "キッズ HIPHOP", level: "小学生", price: 1800, teacher: "講師 甲野", start: "16:30", end: "17:30", cap: 14, rule: { kind: "weekly", weekday: 3 } },
      { id: "l6", studio: "s2", genre: "g1", title: "HIPHOP 振付クラス", level: "経験者向け", price: 3000, teacher: "講師 戊野", start: "19:30", end: "21:00", cap: 12, rule: { kind: "monthly", weekday: 0, nths: [-1] } },

function occurrences(filter, from, to) {
  const rows = [];
  for (const l of db.lessons) {
    if (filter && !filter(l)) continue;
    for (const d of expand(l.rule, from, to)) rows.push({ l, d });
  }
  rows.sort((a, b) => (a.d + a.l.start).localeCompare(b.d + b.l.start));
  return rows;
}

function seatMark(l, d) {
  const left = l.cap - booked(l.id, d);
  if (left <= 0) return { m: "×", cls: "full", left };
  if (left <= 2) return { m: "△", cls: "few", left };
  if (left >= l.cap / 2) return { m: "◎", cls: "", left };
  return { m: "○", cls: "", left };
}

function weekStrip(l) {

  for (let i = 0; i < 7; i++) {
    const d = addDays(start, i), dw = parse(d).getDay();
    const head = '<span class="w' + (dw === 0 ? " sun" : dw === 6 ? " sat" : "") + '">' + WD[dw] + '</span><span class="d">' + (i === 0 || parse(d).getDate() === 1 ? (parse(d).getMonth() + 1) + "/" : "") + parse(d).getDate() + "</span>";
    if (!days.includes(d)) { h += '<span class="cell none">' + head + '<span class="m">－</span><span class="t">&nbsp;</span></span>'; continue; }
    const s = seatMark(l, d);
    h += '<button class="cell ' + s.cls + '" data-pick="' + l.id + "_" + d + '" title="' + jp(d) + " " + l.start + (s.left > 0 ? " 残り" + s.left + "席" : " 満席") + '"' + (s.left > 0 ? "" : " disabled") + ">" + head + '<span class="m">' + s.m + '</span><span class="t">' + l.start + "</span></button>";

}

function submitBooking(name, mail) {
  const [lid, d] = ui.pick.split("_"); const l = lesson(lid);
  if (!name.trim()) return "お名前を入力してください。";
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)) return "メールアドレスの形が正しくありません。";
  if (!expand(l.rule, d, d).length) return "この日程は予約できなくなりました。選び直してください。";
  if (booked(lid, d) >= l.cap) return "満席になりました。別の日程をお選びください。";
  if (db.bookings.some(b => b.lesson === lid && b.date === d && b.mail.toLowerCase() === mail.toLowerCase())) return "このメールアドレスでは同じレッスンを予約済みです。";
  const b = { id: "b" + Date.now(), lesson: lid, date: d, name: name.trim(), mail: mail.trim(), at: new Date().toLocaleString("ja-JP") };
  db.bookings.push(b);
  const s = studio(l.studio);
  const body = "予約が入りました。\n\nスタジオ：" + s.name + "\nレッスン：" + l.title + "（" + l.teacher + "）\n日時：" + jp(d) + " " + l.start + "〜" + l.end + "\nお名前：" + b.name + " 様\nメール：" + b.mail + "\n残り：" + (l.cap - booked(lid, d)) + " 席";
  for (const to of s.notify) db.outbox.unshift({ to, subject: "【予約】" + s.name + " " + jp(d) + " " + l.title, body, at: b.at });
  if (db.confirmToCustomer) db.outbox.unshift({ to: b.mail, subject: "【ご予約確認】" + l.title + " " + jp(d), body: b.name + " 様\n\nご予約ありがとうございます。\n" + s.name + "（" + s.area + "）\n" + jp(d) + " " + l.start + "〜" + l.end + "\n" + l.title, at: b.at });
  save();
  ui.done = b; ui.err = "";
  return "";
}

function calendar(studioFilter, clickable) {
  const [y, m] = ui.calMonth.split("-").map(Number);
  const first = new Date(y, m - 1, 1);
  const startS = addDays(ymd(first), -first.getDay());
  const last = ymd(new Date(y, m, 0));
  const endS = addDays(last, 6 - parse(last).getDay());
  const rows = occurrences(l => studioFilter === "all" || l.studio === studioFilter, startS, endS);
  let h = '<div class="cal-head"><button class="btn sub" data-cal="-1" aria-label="前の月">‹</button><b id="calTitle">' + y + "年" + m + '月</b><button class="btn sub" data-cal="1" aria-label="次の月">›</button>' +
    '<select id="calStudio"><option value="all">全スタジオ</option>' + db.studios.map(s => '<option value="' + s.id + '"' + (studioFilter === s.id ? " selected" : "") + ">" + esc(s.name) + "</option>").join("") + "</select></div>";
  h += '<div class="cal">' + WD.map(w => '<div class="wd">' + w + "</div>").join("");
  for (let s = startS; s <= endS; s = addDays(s, 1)) {
    const evs = rows.filter(r => r.d === s);
    h += '<div class="day' + (s.slice(0, 7) !== ui.calMonth ? " out" : "") + (s === TODAY ? " today" : "") + '" data-day="' + s + '"><span class="n">' + parse(s).getDate() + "</span>" +
      evs.map(({ l, d }) => '<button class="ev" style="--c:' + studio(l.studio).color + '" title="' + esc(studio(l.studio).name + " " + l.title + " " + l.start) + '" data-ev="' + l.id + "_" + d + '"' + (clickable && d >= TODAY && d <= addDays(TODAY, HORIZON) ? "" : ' data-ro="1"') + ">" + l.start + " " + esc(genre(l.genre).name) + (booked(l.id, d) ? "・" + booked(l.id, d) + "名" : "") + "</button>").join("") + "</div>";
  }
  h += '</div><div class="legend">' + db.studios.map(s => '<span><i style="--c:' + s.color + '"></i>' + esc(s.name) + "</span>").join("") + "</div>";
  return h;
}

      '<div class="inline"><label>休みにする日<input id="fSkip" type="date"></label><button class="btn sub" type="button" data-act="addskip">休みに追加</button></div>' +
      ((r.skips || []).length ? '<div class="inline">' + r.skips.map((s, i) => '<span class="chip bad">' + jp(s) + ' <button class="tag-del" type="button" data-delskip="' + i + '">×</button></span>').join("") + "</div>" : "")) +
    '</div><div class="err" id="lErr">' + esc(ui.err) + '</div><div class="inline"><button class="btn" type="submit" id="lSave">' + (e.id ? "変更を保存" : "このレッスンを追加") + "</button>" + (e.id ? '<button class="btn sub" type="button" data-act="cancelEdit">編集をやめる</button>' : "") + "</div></form></div>" +
    '<div class="panel"><h2 style="margin-top:0">この設定で作られる日程（今日から90日）</h2><p id="ruleText" style="margin:0 0 6px"><b>' + esc(ruleText(r)) + "</b></p><p style='margin:0 0 8px;color:var(--muted)' id=\"prevCount\">" + prev.length + ' 回</p><ol class="preview" id="preview">' + prev.map(s => "<li>" + jp(s) + "</li>").join("") + "</ol></div></div>";
  h += '<h2>登録済みのレッスン</h2><div class="panel" style="padding:0"><table id="lessonTable"><thead><tr><th>スタジオ</th><th>レッスン</th><th>時間</th><th>繰り返し</th><th>定員</th><th></th></tr></thead><tbody>' +
    db.lessons.map(l => "<tr><td>" + esc(studio(l.studio).name) + "</td><td>" + esc(l.title) + "<br><small>" + esc(genre(l.genre).name) + "・" + esc(l.teacher) + "</small></td><td>" + l.start + "〜" + l.end + "</td><td>" + esc(ruleText(l.rule)) + "</td><td>" + l.cap + '</td><td><button class="btn sub" data-editlesson="' + l.id + '">編集</button></td></tr>').join("") + "</tbody></table></div>";
  return h;
}
function adminGenres() {
  return '<div class="panel"><h2 style="margin-top:0">ジャンル（予約サイトの「ジャンル選択」に出ます）</h2><table id="genreTable"><thead><tr><th>ジャンル名</th><th>使っているレッスン</th><th></th></tr></thead><tbody>' +
    db.genres.map(g => { const n = db.lessons.filter(l => l.genre === g.id).length; return '<tr><td><input data-gname="' + g.id + '" value="' + esc(g.name) + '" style="border:1px solid var(--line);border-radius:6px;padding:4px 8px"></td><td>' + n + ' 件</td><td><button class="btn sub" data-delgenre="' + g.id + '"' + (n ? ' disabled title="使っているレッスンがあるため削除できません"' : "") + ">削除</button></td></tr>"; }).join("") +
    '</tbody></table><form class="inline" id="genreForm" style="margin-top:12px"><input id="gNew" placeholder="新しいジャンル名（例：ブレイキン）" style="border:1px solid var(--line);border-radius:8px;padding:6px 10px"><button class="btn">ジャンルを追加</button></form><div class="err" id="gErr">' + esc(ui.err) + "</div></div>";
}

// ===== 描画とイベント =====
function render() {
  document.querySelectorAll("#tabs button").forEach(b => { if (b.dataset.tab === ui.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  const app = document.getElementById("app");
  app.innerHTML = ui.tab === "book" ? viewBook() : ui.tab === "calendar" ? viewCalendar() : viewAdmin();
}
function readLessonForm() {
  const e = ui.edit, $ = id => document.getElementById(id);
  if (!$("lessonForm")) return;
  e.studio = $("fStudio").value; e.genre = $("fGenre").value; e.title = $("fTitle").value; e.teacher = $("fTeacher").value;
  e.start = $("fStart").value; e.end = $("fEnd").value; e.cap = Number($("fCap").value); e.price = Number($("fPrice").value) || 0; e.level = $("fLevel").value.trim();
  const r = e.rule;
  r.kind = document.querySelector('input[name="kind"]:checked').value;
  if ($("fDate")) r.date = $("fDate").value;
  if ($("fWd")) r.weekday = Number($("fWd").value);
  if ($("fAnchor")) r.anchor = $("fAnchor").value;
  if ($("fNths")) r.nths = [...$("fNths").querySelectorAll("input:checked")].map(i => Number(i.value));
  if ($("fFrom")) r.start = $("fFrom").value;
  if ($("fTo")) r.end = $("fTo").value;
}
function validLesson(e) {
  const r = e.rule;
  if (!e.title.trim()) return "レッスン名を入力してください。";
  if (!e.start || !e.end || e.end <= e.start) return "終了時刻は開始時刻より後にしてください。";
  if (!(e.cap >= 1 && e.cap <= 100)) return "定員は1〜100で入力してください。";
  if (r.kind === "once" && !r.date) return "日付を選んでください。";
  if (r.kind === "biweekly" && (!r.anchor || parse(r.anchor).getDay() !== Number(r.weekday))) return "隔週の初回の日は、選んだ曜日の日付にしてください。";
  if (r.kind === "monthly" && !(r.nths || []).length) return "第何週かを1つ以上選んでください。";
  if (r.start && r.end && r.end < r.start) return "期間の終了は開始より後にしてください。";
  return "";
}
document.getElementById("tabs").addEventListener("click", ev => { const b = ev.target.closest("button[data-tab]"); if (!b) return; ui.tab = b.dataset.tab; ui.err = ""; render(); });
document.getElementById("reset").addEventListener("click", () => { db = seed(); save(); Object.assign(ui, { step: 1, done: null, pick: null, edit: null, err: "" }); render(); });
document.getElementById("app").addEventListener("click", ev => {
  if (ev.target.id === "sheet") { ui.step = 3; ui.err = ""; render(); return; }
  const t = ev.target.closest("button,[data-ev]"); if (!t) return;
  const d = t.dataset;
  if (d.studio) { ui.studio = d.studio; ui.step = 2; }
  else if (d.genre) { ui.genre = d.genre; ui.step = 3; ui.week = 0; }
  else if (d.pick) { ui.pick = d.pick; ui.step = 4; ui.err = ""; }
  else if (d.act === "back" || d.act === "closeSheet") { ui.step = Math.max(1, ui.step - 1); ui.err = ""; }
  else if (d.act === "toStudios") { Object.assign(ui, { step: 1, studio: null, genre: null, pick: null, err: "" }); }
  else if (d.act === "toGenres") { Object.assign(ui, { step: 2, genre: null, pick: null, err: "" }); }
  else if (d.wk) { ui.week = Math.min(7, Math.max(0, ui.week + Number(d.wk))); }
  else if (d.act === "restart") { Object.assign(ui, { step: 1, done: null, pick: null, studio: null, genre: null, week: 0 }); }
  else if (d.cal) { const [y, m] = ui.calMonth.split("-").map(Number); const n = new Date(y, m - 1 + Number(d.cal), 1); ui.calMonth = n.getFullYear() + "-" + pad(n.getMonth() + 1); }
  else if (d.ev) { if (d.ro) return; const [lid, dd] = d.ev.split("_"); const l = lesson(lid); Object.assign(ui, { tab: "book", studio: l.studio, genre: l.genre, pick: d.ev, step: 4, done: null, err: "", week: Math.max(0, Math.min(7, Math.floor((parse(dd) - parse(TODAY)) / 604800000))) }); }
  else if (d.admin) { ui.adminTab = d.admin; ui.err = ""; }
  else if (d.editlesson) { ui.edit = JSON.parse(JSON.stringify(lesson(d.editlesson))); ui.edit.rule = Object.assign({ anchor: TODAY, nths: [1], date: TODAY, start: "", end: "", skips: [] }, ui.edit.rule); ui.err = ""; window.scrollTo(0, 0); }
  else if (d.act === "cancelEdit") { ui.edit = null; ui.err = ""; }
  else if (d.act === "addskip") { readLessonForm(); const v = document.getElementById("fSkip").value; if (v && !ui.edit.rule.skips.includes(v)) { ui.edit.rule.skips.push(v); ui.edit.rule.skips.sort(); } }
  else if (d.delskip) { readLessonForm(); ui.edit.rule.skips.splice(Number(d.delskip), 1); }
  else if (d.delgenre) { db.genres = db.genres.filter(g => g.id !== d.delgenre || db.lessons.some(l => l.genre === g.id)); save(); }
  else if (d.delmail) { const [sid, i] = d.delmail.split("_"); const s = studio(sid); if (s.notify.length <= 1) { ui.err = "通知先は1件以上残してください。"; } else { s.notify.splice(Number(i), 1); ui.err = ""; save(); } }
  else return;
  render();
});
document.getElementById("app").addEventListener("change", ev => {
  const t = ev.target;
  if (t.id === "calStudio") { ui.calStudio = t.value; render(); }
  else if (t.id === "confirmToCustomer") { db.confirmToCustomer = t.checked; save(); }
  else if (t.dataset.gname) { const v = t.value.trim(); if (v) { genre(t.dataset.gname).name = v; save(); } render(); }
  else if (t.closest("#lessonForm") && t.id !== "fSkip") { readLessonForm(); ui.err = ""; render(); }
});
document.getElementById("app").addEventListener("submit", ev => {
  ev.preventDefault();
  const f = ev.target;
  if (f.id === "bookForm") {
    ui.fName = document.getElementById("bName").value; ui.fMail = document.getElementById("bMail").value;
    ui.err = submitBooking(ui.fName, ui.fMail);
    if (!ui.err) { ui.fName = ""; ui.fMail = ""; }
  }
  else if (f.id === "lessonForm") {
    readLessonForm(); const e = ui.edit; ui.err = validLesson(e);
    if (!ui.err) {
      if (e.id) { db.lessons[db.lessons.findIndex(l => l.id === e.id)] = e; } else { e.id = "l" + Date.now(); db.lessons.push(e); }
      save(); ui.edit = null;
    }
  } else if (f.id === "genreForm") {
    const v = document.getElementById("gNew").value.trim();
    ui.err = !v ? "ジャンル名を入力してください。" : db.genres.some(g => g.name === v) ? "同じ名前のジャンルがあります。" : "";
    if (!ui.err) { db.genres.push({ id: "g" + Date.now(), name: v }); save(); }
  } else if (f.dataset.addmail) {
    const v = f.querySelector("input").value.trim(); const s = studio(f.dataset.addmail);
    ui.err = !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) ? "メールアドレスの形が正しくありません。" : s.notify.includes(v) ? "登録済みのアドレスです。" : "";
    if (!ui.err) { s.notify.push(v); save(); }
  }
  render();
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && ui.tab === "book" && ui.step === 4) { ui.step = 3; ui.err = ""; render(); } });
const CREDITS = [["p1", "West End Centre Aldershot Dance Studio", "Jack1956", "CC0"], ["p2", "Dance Studio First", "Douglas P. Perkins", "CC BY 2.0"], ["p4", "KC Ballet Studio 3", "KCBalletMedia", "CC BY 2.0"]];
document.getElementById("credits").innerHTML = "写真はイメージです（実在のスタジオではありません）。出典：Wikimedia Commons — " + CREDITS.map(c => esc(c[1]) + "（" + esc(c[2]) + "・" + c[3] + "）").join("／");
window.__demo = { expand, matches, ruleText };
render();
</script>
